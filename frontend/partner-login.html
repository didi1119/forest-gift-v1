<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知音大使 - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-dark: #1A2F23;
            --forest-medium: #2D4A3E;
            --forest-light: #4A675A;
            --forest-faint: #E8ECE9;
            --paper: #F5F2EB;
            --gold: #C5A065;
            --gold-light: #DFC698;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--forest-dark);
        }
        h1, h2, h3, .font-serif {
            font-family: 'Noto Serif TC', serif;
        }
        .glass-card {
            background: rgba(245, 242, 235, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.25rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.06);
        }
        .input-field {
            transition: all 0.2s ease;
            border: 1px solid rgba(26,47,35,0.15);
            background: rgba(255,255,255,0.8);
        }
        .input-field:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(197, 160, 101, 0.12);
            background: #fff;
        }
        .btn-login {
            background: var(--forest-dark);
            color: var(--gold);
            border: 1px solid rgba(197,160,101,0.3);
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: var(--forest-medium);
            border-color: rgba(197,160,101,0.6);
            box-shadow: 0 0 24px rgba(197,160,101,0.15);
        }
        .btn-login:disabled {
            opacity: 0.6;
        }
        .gold-line {
            width: 2rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto;
        }
        .msg-error {
            animation: fadeShake 0.4s ease;
        }
        @keyframes fadeShake {
            0% { opacity: 0; transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            100% { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="min-h-screen relative overflow-hidden">

    <!-- Full-screen forest background -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-cover bg-center"
            style="background-image: url('images/hero-cabin.jpg'); background-position: center 55%;">
        </div>
        <div class="absolute inset-0 bg-[#1A2F23]/70"></div>
    </div>

    <!-- Noise texture overlay -->
    <div class="fixed inset-0 z-[1] pointer-events-none opacity-30"
        style="background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E&quot;);">
    </div>

    <!-- Content -->
    <div class="relative z-10 min-h-screen flex items-center justify-center py-12 px-4">
        <div class="max-w-sm w-full">

            <!-- Brand header -->
            <div class="text-center mb-8">
                <p class="text-xs font-bold tracking-[0.35em] text-[#C5A065] uppercase mb-4">靜謐森林</p>
                <h1 class="font-serif text-3xl font-semibold text-[#F5F2EB] mb-2"
                    style="text-shadow: 0 2px 16px rgba(0,0,0,0.3);">知音大使</h1>
                <div class="gold-line my-4"></div>
                <p class="text-sm font-light text-[#F5F2EB]/70">登入查看您的推薦成果</p>
            </div>

            <!-- Login Card -->
            <div class="glass-card p-8">
                <form class="space-y-5" onsubmit="handleLogin(event)">
                    <div>
                        <label for="partnerCode" class="block text-sm font-medium mb-1.5" style="color: var(--forest-light);">
                            Email 或大使代碼
                        </label>
                        <input
                            type="text"
                            id="partnerCode"
                            name="partnerCode"
                            placeholder="優先輸入申請時使用的 Email"
                            class="input-field w-full px-4 py-3 rounded-lg text-sm focus:outline-none"
                            required
                        >
                        <p class="text-xs mt-1.5" style="color: var(--forest-light); opacity: 0.6;">可輸入申請時的 Email，或你專屬的私密大使代碼登入</p>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium mb-1.5" style="color: var(--forest-light);">
                            手機號碼後 4 碼
                        </label>
                        <input
                            type="text"
                            id="phone"
                            name="phone"
                            placeholder="請輸入手機後4碼"
                            maxlength="4"
                            pattern="[0-9]{4}"
                            class="input-field w-full px-4 py-3 rounded-lg text-sm focus:outline-none"
                            required
                        >
                        <p class="text-xs mt-1.5" style="color: var(--forest-light); opacity: 0.6;">使用註冊時提供的手機號碼後4碼</p>
                    </div>

                    <!-- Error / Success Message -->
                    <div id="errorMessage" class="hidden msg-error px-4 py-3 rounded-lg text-sm"></div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        id="loginButton"
                        class="w-full btn-login py-3.5 px-6 rounded-lg text-sm font-semibold tracking-wide"
                    >
                        <span id="loginText">登入</span>
                        <span id="loginSpinner" class="hidden">
                            <svg class="animate-spin h-4 w-4 inline mr-2" style="color: var(--gold);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            驗證中...
                        </span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="mt-8 pt-6" style="border-top: 1px solid rgba(26,47,35,0.1);">
                    <p class="text-xs text-center" style="color: var(--forest-light); opacity: 0.7;">
                        忘記大使代碼或需要協助？
                        <a href="https://line.me/R/ti/p/@478hisen" target="_blank"
                            class="font-medium underline hover:opacity-100 transition" style="color: var(--gold);">官方 LINE@</a>
                        聯繫我們
                    </p>
                </div>
            </div>

            <!-- Feature hints -->
            <div class="mt-5 grid grid-cols-2 gap-x-6 gap-y-3 px-2">
                <div class="flex items-center gap-2.5 text-xs text-[#F5F2EB]/50">
                    <span class="w-1 h-1 rounded-full bg-[#C5A065]/60 flex-shrink-0"></span>
                    推薦成果統計
                </div>
                <div class="flex items-center gap-2.5 text-xs text-[#F5F2EB]/50">
                    <span class="w-1 h-1 rounded-full bg-[#C5A065]/60 flex-shrink-0"></span>
                    佣金收益記錄
                </div>
                <div class="flex items-center gap-2.5 text-xs text-[#F5F2EB]/50">
                    <span class="w-1 h-1 rounded-full bg-[#C5A065]/60 flex-shrink-0"></span>
                    等級進度追蹤
                </div>
                <div class="flex items-center gap-2.5 text-xs text-[#F5F2EB]/50">
                    <span class="w-1 h-1 rounded-full bg-[#C5A065]/60 flex-shrink-0"></span>
                    專屬推薦連結
                </div>
            </div>

            <!-- Footer links -->
            <div class="mt-8 flex justify-center gap-6 text-xs text-[#F5F2EB]/40">
                <a href="index.html" class="hover:text-[#C5A065] transition">回到首頁</a>
                <a href="invitation.html" class="hover:text-[#C5A065] transition">加入知音計畫</a>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = '/api';

        async function handleLogin(event) {
            event.preventDefault();

            const loginIdentifier = document.getElementById('partnerCode').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!loginIdentifier || !phone) {
                showError('請填寫所有必填欄位');
                return;
            }

            if (phone.length !== 4 || !/^\d{4}$/.test(phone)) {
                showError('手機後4碼必須是4位數字');
                return;
            }

            showLoading(true);
            hideError();

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        action: 'verify_partner_login',
                        login_identifier: loginIdentifier,
                        phone_last4: phone
                    })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('partnerCode', result.partner.partner_code);
                    sessionStorage.setItem('partnerData', JSON.stringify(result.partner));
                    sessionStorage.setItem('loginTime', Date.now().toString());
                    showSuccess('登入成功，正在載入...');
                    setTimeout(() => { window.location.href = 'partner-dashboard.html'; }, 1200);
                } else {
                    showError(result.error || '登入資訊不正確');
                }
            } catch (error) {
                console.error('登入錯誤:', error);
                showError('連線失敗，請檢查網路連線後重試');
            } finally {
                showLoading(false);
            }
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.className = 'msg-error px-4 py-3 rounded-lg text-sm';
            el.style.background = 'rgba(220, 38, 38, 0.06)';
            el.style.border = '1px solid rgba(220, 38, 38, 0.15)';
            el.style.color = '#DC2626';
        }

        function hideError() {
            const el = document.getElementById('errorMessage');
            el.className = 'hidden';
            el.style = '';
        }

        function showSuccess(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.className = 'msg-error px-4 py-3 rounded-lg text-sm';
            el.style.background = 'rgba(45, 74, 62, 0.06)';
            el.style.border = '1px solid rgba(45, 74, 62, 0.15)';
            el.style.color = 'var(--forest-medium)';
        }

        function showLoading(isLoading) {
            const button = document.getElementById('loginButton');
            const text = document.getElementById('loginText');
            const spinner = document.getElementById('loginSpinner');
            button.disabled = isLoading;
            button.classList.toggle('opacity-60', isLoading);
            text.classList.toggle('hidden', isLoading);
            spinner.classList.toggle('hidden', !isLoading);
        }

        document.getElementById('phone').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        window.addEventListener('load', function() {
            if (sessionStorage.getItem('partnerCode')) {
                window.location.href = 'partner-dashboard.html';
            }
        });
    </script>
</body>
</html>
