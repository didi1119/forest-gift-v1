<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短網址服務測試</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">🔗 短網址服務測試</h1>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">測試網址</h2>
            <input type="text" id="testUrl"
                   class="w-full px-4 py-2 border border-gray-300 rounded mb-4"
                   placeholder="輸入要縮短的網址"
                   value="/api?pid=TEST001&dest=landing">

            <button onclick="testShortUrl()"
                    class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                測試短網址生成
            </button>
        </div>

        <div id="results" class="bg-white rounded-lg shadow p-6 hidden">
            <h2 class="text-lg font-semibold mb-4">測試結果</h2>
            <div id="resultContent" class="space-y-4"></div>
        </div>
    </div>

    <script>
        async function testShortUrl() {
            const url = document.getElementById('testUrl').value;
            const resultDiv = document.getElementById('results');
            const contentDiv = document.getElementById('resultContent');

            resultDiv.classList.remove('hidden');
            contentDiv.innerHTML = '<p class="text-gray-500">測試中...</p>';

            let html = '';

            // Test 1: Backend proxy (shorten_url action)
            html += '<div class="border-b pb-4">';
            html += '<h3 class="font-semibold mb-2">1️⃣ 後端 Proxy 測試（POST /api shorten_url）</h3>';
            try {
                const start1 = Date.now();
                const response1 = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'shorten_url', url: url })
                });
                const time1 = Date.now() - start1;

                if (response1.ok) {
                    const data = await response1.json();
                    if (data.success && data.short_url) {
                        html += `<p class="text-green-600">✅ 成功 (${time1}ms)</p>`;
                        html += `<p class="text-sm bg-green-50 p-2 rounded mt-2 break-all">${data.short_url}</p>`;
                    } else {
                        html += `<p class="text-red-600">❌ 回應異常</p>`;
                        html += `<p class="text-sm text-gray-600">回應: ${JSON.stringify(data)}</p>`;
                    }
                } else {
                    html += `<p class="text-red-600">❌ HTTP ${response1.status}</p>`;
                }
            } catch (error) {
                html += `<p class="text-red-600">❌ 錯誤: ${error.message}</p>`;
            }
            html += '</div>';

            // Test 2: Combined function
            html += '<div class="mt-4">';
            html += '<h3 class="font-semibold mb-2">2️⃣ 整合函數測試（實際使用的邏輯）</h3>';
            try {
                const start3 = Date.now();
                const shortUrl = await createShortUrl(url);
                const time3 = Date.now() - start3;
                const isShort = shortUrl !== url;

                if (isShort) {
                    html += `<p class="text-green-600">✅ 成功 (${time3}ms)</p>`;
                    html += `<p class="text-sm bg-green-50 p-2 rounded mt-2 break-all">${shortUrl}</p>`;
                } else {
                    html += `<p class="text-orange-600">⚠️ 短網址服務失敗，返回原始 URL</p>`;
                    html += `<p class="text-sm text-gray-600 mt-2">這表示在實際使用時會顯示完整的 Google Apps Script URL</p>`;
                }
            } catch (error) {
                html += `<p class="text-red-600">❌ 錯誤: ${error.message}</p>`;
            }
            html += '</div>';

            contentDiv.innerHTML = html;
        }

        // Same function as in link-generator-form.html — uses backend proxy
        async function createShortUrl(originalUrl) {
            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'shorten_url', url: originalUrl })
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.short_url) {
                        console.log('✅ 短網址生成成功:', data.short_url);
                        return data.short_url;
                    }
                }
            } catch (error) {
                console.warn('⚠️ 短網址生成失敗:', error);
            }
            console.error('❌ 短網址服務失敗，返回原始 URL');
            return originalUrl;
        }
    </script>
</body>
</html>
