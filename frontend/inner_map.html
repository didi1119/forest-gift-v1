<html lang="zh-Hant">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { serif: ["'Noto Serif TC'", 'serif'], sans: ["'Noto Sans TC'", 'sans-serif'] } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-dark: #1A2F23;
            --forest-light: #4A675A;
            --gold: #C5A065;
            --gold-light: #DFC698;
            --paper: #F5F2EB;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--paper);
            color: var(--forest-light);
        }
        h1, h2, h3, h4, .font-serif {
            font-family: 'Noto Serif TC', serif !important;
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Progress dots */
        .progress-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 1.5px solid rgba(197,160,101,0.3);
            background: transparent;
            transition: all 0.6s ease;
        }
        .progress-dot.active {
            border-color: var(--gold);
            background: var(--gold);
            box-shadow: 0 0 12px rgba(197,160,101,0.4);
        }
        .progress-dot.current {
            border-color: var(--gold);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(197,160,101,0); }
            50% { box-shadow: 0 0 0 6px rgba(197,160,101,0.15); }
        }
        .progress-line {
            height: 1px;
            background: rgba(197,160,101,0.15);
            flex: 1;
        }
        .progress-line.active {
            background: var(--gold);
        }

        /* Day card */
        .day-card {
            background: #FFFFFF;
            border: 1px solid rgba(26,47,35,0.06);
            border-radius: 1.5rem;
            box-shadow: 0 8px 48px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }
        .day-watermark {
            position: absolute;
            top: -1rem;
            right: -0.5rem;
            font-size: 8rem;
            font-family: 'Noto Serif TC', serif;
            color: var(--forest-dark);
            opacity: 0.025;
            line-height: 1;
            pointer-events: none;
            user-select: none;
        }
        .ritual-box {
            background: rgba(26,47,35,0.04);
            border: 1px solid rgba(26,47,35,0.06);
            border-radius: 1rem;
        }
        .ritual-item {
            position: relative;
            padding-left: 1.5rem;
            line-height: 1.85;
        }
        .ritual-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.7rem;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--gold);
        }

        /* Textarea */
        .journal-textarea {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            line-height: 2;
            min-height: 12rem;
            resize: vertical;
            background: rgba(245,242,235,0.5);
            border: 1px solid rgba(26,47,35,0.1);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            width: 100%;
            transition: all 0.4s ease;
            color: var(--forest-dark);
        }
        .journal-textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(197,160,101,0.1);
            background: #FFFFFF;
        }
        .journal-textarea::placeholder {
            color: rgba(74,103,90,0.35);
            font-style: italic;
        }

        /* Review card (collapsed past days) */
        .review-card {
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(26,47,35,0.06);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .review-card:hover {
            background: rgba(255,255,255,0.9);
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .review-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }
        .review-card.expanded .review-content {
            max-height: 600px;
        }

        /* Countdown */
        .countdown-text {
            color: rgba(197,160,101,0.6);
            font-size: 0.8rem;
            letter-spacing: 0.12em;
        }

        /* Gold line */
        .gold-line {
            width: 3rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto;
        }

        /* Hero start button */
        .start-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            letter-spacing: 0.12em;
            background: rgba(197,160,101,0.12);
            border: 1px solid rgba(197,160,101,0.4);
            color: var(--paper);
            backdrop-filter: blur(4px);
            transition: all 0.5s ease;
            cursor: pointer;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(197,160,101,0.2);
            border-color: rgba(197,160,101,0.6);
        }

        /* Mobile */
        @media (max-width: 639px) {
            .day-watermark { font-size: 5rem !important; top: -0.25rem !important; }
            .day-card { border-radius: 1rem; }
        }
    </style>
</head>

    const DAY_LABELS = ['一', '二', '三', '四', '五', '六', '七'];

    // ========================================
    // Core Logic
    // ========================================
    function getStartDate() {
        return localStorage.getItem('innermap_start_date');
    }

    function setStartDate() {
        const today = new Date().toISOString().split('T')[0];
        localStorage.setItem('innermap_start_date', today);
        return today;
    }

    function getUnlockedDays() {
        const startStr = getStartDate();
        if (!startStr) return 0;
        const start = new Date(startStr + 'T00:00:00');
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffMs = today - start;
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        return Math.min(7, Math.max(1, diffDays + 1));
    }

    function getSavedContent(day) {
        return localStorage.getItem(`innermap_day_${day}`) || '';
    }

    function saveContent(day, content) {
        localStorage.setItem(`innermap_day_${day}`, content);
    }

    function hasMeaningfulContent(day) {
        const content = getSavedContent(day);
        return content && content.trim().length > 10;
    }

    // ========================================
    // Rendering
    // ========================================
    function startJourney() {
        setStartDate();
        render();
    }

    function render() {
        const startDate = getStartDate();

        if (!startDate) {
            document.getElementById('stateA').classList.remove('hidden');
            document.getElementById('stateBC').classList.add('hidden');
            return;
        }

        document.getElementById('stateA').classList.add('hidden');
        document.getElementById('stateBC').classList.remove('hidden');

        const unlocked = getUnlockedDays();
        renderProgressBar(unlocked);
        renderCurrentDay(unlocked);
        renderPastDays(unlocked);
        renderCountdown(unlocked);
        renderCompletion(unlocked);

        // Trigger fade-in
        requestAnimationFrame(() => {
            document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
        });
    }

    function renderProgressBar(unlocked) {
        const bar = document.getElementById('progressBar');
        const label = document.getElementById('progressLabel');
        let html = '';

        for (let i = 1; i <= 7; i++) {
            const isActive = hasMeaningfulContent(i);
            const isCurrent = i === unlocked && !hasMeaningfulContent(i);
            const isUnlocked = i <= unlocked;

            if (i > 1) {
                html += `<div class="progress-line ${i <= unlocked ? 'active' : ''}"></div>`;
            }
            html += `<div class="progress-dot ${isActive ? 'active' : ''} ${isCurrent ? 'current' : ''}" title="第${DAY_LABELS[i-1]}日"></div>`;
        }
        bar.innerHTML = html;

        const completed = DAYS.filter((_, i) => hasMeaningfulContent(i + 1)).length;
        if (unlocked >= 7 && completed >= 7) {
            label.textContent = '旅程已完成';
        } else {
            label.textContent = `第${DAY_LABELS[unlocked - 1]}日`;
        }
    }

    function renderCurrentDay(unlocked) {
        const container = document.getElementById('currentDayContainer');
        const day = DAYS[unlocked - 1];
        const dayNum = unlocked;
        const saved = getSavedContent(dayNum);

        let ritualHtml = day.ritual.map(r => `<p class="ritual-item">${r}</p>`).join('');
        if (day.ritualDetails) {
            ritualHtml += '<div class="pl-4 sm:pl-6 space-y-2 mt-3">';
            ritualHtml += day.ritualDetails.map(d => `<p class="text-sm leading-relaxed">${d}</p>`).join('');
            ritualHtml += '</div>';
        }
        if (day.ritualEnd) {
            ritualHtml += `<p class="ritual-item mt-4">${day.ritualEnd}</p>`;
        }

        container.innerHTML = `
            <div class="day-card p-6 sm:p-10 fade-in">
                <div class="day-watermark">${String(dayNum).padStart(2, '0')}</div>
                <div class="relative z-10">
                    <p class="text-xs font-medium tracking-[0.25em] uppercase mb-4" style="color: var(--gold);">Day ${String(dayNum).padStart(2, '0')}</p>
                    <h2 class="font-serif text-2xl sm:text-3xl font-medium mb-2" style="color: var(--forest-dark);">第${DAY_LABELS[dayNum - 1]}日：${day.title}</h2>
                    <h3 class="text-base sm:text-lg mb-8" style="color: var(--forest-light);">主題：${day.theme}</h3>

                    <p class="text-sm sm:text-base leading-relaxed mb-8" style="color: var(--forest-light); line-height: 1.9;">${day.intro}</p>

                    <div class="ritual-box p-5 sm:p-6 mb-8">
                        <h4 class="font-serif font-medium text-base mb-4" style="color: var(--forest-dark);">今日儀式</h4>
                        <div class="space-y-3 text-sm sm:text-base" style="color: var(--forest-light); line-height: 1.85;">
                            ${ritualHtml}
                        </div>
                    </div>

                    <div>
                        <h4 class="font-serif font-medium text-base mb-3" style="color: var(--forest-dark);">今日手記</h4>
                        <p class="text-sm mb-4" style="color: var(--forest-light);">${day.journalPrompt}</p>
                        <textarea
                            class="journal-textarea"
                            data-day="${dayNum}"
                            placeholder="${day.placeholder}"
                            oninput="onJournalInput(${dayNum}, this.value)"
                        >${saved}</textarea>
                    </div>
                </div>
            </div>
        `;
    }

    function renderPastDays(unlocked) {
        const section = document.getElementById('pastDaysSection');
        const container = document.getElementById('pastDaysContainer');

        if (unlocked <= 1) {
            section.classList.add('hidden');
            return;
        }

        section.classList.remove('hidden');
        let html = '';

        // Show days 1 to unlocked-1 (past days) in reverse order
        for (let i = unlocked - 1; i >= 1; i--) {
            const day = DAYS[i - 1];
            const content = getSavedContent(i);
            const hasContent = content && content.trim().length > 10;
            const preview = content ? content.trim().slice(0, 60) + (content.length > 60 ? '...' : '') : '（未書寫）';

            html += `
                <div class="review-card px-4 py-3 sm:px-5 sm:py-4" onclick="toggleReview(this)">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="font-serif text-sm font-medium" style="color: ${hasContent ? 'var(--gold)' : 'var(--forest-light)'};">Day ${String(i).padStart(2, '0')}</span>
                            <span class="text-sm" style="color: var(--forest-dark);">第${DAY_LABELS[i-1]}日：${day.title}</span>
                        </div>
                        <svg class="w-4 h-4 transition-transform" style="color: var(--forest-light);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <div class="review-content">
                        <div class="pt-3 mt-3 border-t" style="border-color: rgba(26,47,35,0.06);">
                            <p class="text-xs uppercase tracking-widest mb-2" style="color: var(--gold);">手記內容</p>
                            <p class="text-sm leading-relaxed whitespace-pre-wrap" style="color: var(--forest-light);">${content ? content.replace(/</g, '&lt;').replace(/>/g, '&gt;') : '<em style="color:rgba(74,103,90,0.4);">尚未書寫</em>'}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;
    }

    function renderCountdown(unlocked) {
        const section = document.getElementById('countdownSection');
        const text = document.getElementById('countdownText');

        if (unlocked >= 7) {
            section.classList.add('hidden');
            return;
        }

        section.classList.remove('hidden');
        updateCountdown();

        // Update every minute
        if (window._countdownInterval) clearInterval(window._countdownInterval);
        window._countdownInterval = setInterval(updateCountdown, 60000);
    }

    function updateCountdown() {
        const text = document.getElementById('countdownText');
        if (!text) return;

        const now = new Date();
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const diffMs = tomorrow - now;
        const hours = Math.floor(diffMs / (1000 * 60 * 60));
        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

        text.textContent = `明天的旅程將在 ${hours} 小時 ${minutes} 分後展開`;
    }

    function renderCompletion(unlocked) {
        const section = document.getElementById('completionSection');
        if (unlocked >= 7) {
            section.classList.remove('hidden');
        } else {
            section.classList.add('hidden');
        }
    }

    // ========================================
    // Interactions
    // ========================================
    function onJournalInput(day, value) {
        saveContent(day, value);
        renderProgressBar(getUnlockedDays());
    }

    function toggleReview(card) {
        card.classList.toggle('expanded');
        const arrow = card.querySelector('svg');
        if (arrow) {
            arrow.style.transform = card.classList.contains('expanded') ? 'rotate(180deg)' : '';
        }
    }

    // ========================================
    // Init
    // ========================================
    document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
