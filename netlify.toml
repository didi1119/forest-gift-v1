[build]
  publish = "."
  command = "echo 'No build needed for static site'"

# 備用部署平台（主要使用 Vercel）
# 環境變數請在 Netlify Dashboard > Site Settings > Environment variables 設定：
#   GOOGLE_SHEET_ID, GOOGLE_CLIENT_EMAIL, GOOGLE_PRIVATE_KEY,
#   NETLIFY_ACCESS_TOKEN, GITHUB_REPO_URL

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 重定向設定 - 確保所有路徑都能正確訪問
[[redirects]]
  from = "/music"
  to = "/music.html"
  status = 200

[[redirects]]
  from = "/story"
  to = "/story.html"
  status = 200

[[redirects]]
  from = "/inner-map"
  to = "/inner_map.html"
  status = 200

[[redirects]]
  from = "/generator"
  to = "/link-generator.html"
  status = 200 