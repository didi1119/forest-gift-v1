<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靜謐森林｜LINE 自動登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #1A2F23;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1, h2, .font-serif { font-family: 'Noto Serif TC', serif; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(197,160,101,0.2);
            border-top-color: #C5A065;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="text-center px-6 max-w-sm mx-auto">
        <!-- 載入中 -->
        <div id="loadingState">
            <div class="spinner mx-auto mb-6"></div>
            <p id="loadingMsg" class="text-[#C5A065] font-serif text-lg mb-2">正在驗證身份</p>
            <p class="text-[#F5F2EB]/60 text-sm">請稍候...</p>
        </div>

        <!-- 成功 -->
        <div id="successState" class="hidden">
            <div class="w-16 h-16 rounded-full bg-[#06C755]/20 flex items-center justify-center mx-auto mb-5">
                <svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path stroke="#06C755" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </div>
            <p id="successTitle" class="text-[#F5F2EB] font-serif text-xl mb-2"></p>
            <p id="successMsg" class="text-[#F5F2EB]/70 text-sm mb-6"></p>
            <p class="text-[#F5F2EB]/40 text-xs">正在跳轉至儀表板...</p>
        </div>

        <!-- 錯誤 -->
        <div id="errorState" class="hidden">
            <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-5">
                <svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </div>
            <p class="text-[#F5F2EB] font-serif text-xl mb-2">操作失敗</p>
            <p id="errorMsg" class="text-[#F5F2EB]/70 text-sm mb-6"></p>
            <a href="partner-login.html" class="inline-block text-[#C5A065] text-sm underline underline-offset-4">使用帳號密碼登入</a>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        const DASHBOARD_URL = 'partner-dashboard.html';

        function showState(state) {
            document.getElementById('loadingState').classList.toggle('hidden', state !== 'loading');
            document.getElementById('successState').classList.toggle('hidden', state !== 'success');
            document.getElementById('errorState').classList.toggle('hidden', state !== 'error');
        }

        function showError(msg) {
            document.getElementById('errorMsg').textContent = msg;
            showState('error');
        }

        function getPartnerCode() {
            const urlParams = new URLSearchParams(window.location.search);
            let code = urlParams.get('code') || '';
            if (!code) {
                const state = urlParams.get('liff.state') || '';
                const stateParams = new URLSearchParams(state.replace('?', ''));
                code = stateParams.get('code') || '';
            }
            return code;
        }

        async function start() {
            // 取得 LIFF ID
            try {
                const resp = await fetch(API_URL + '?get_liff_id=1');
                const data = await resp.json();
                if (data.liff_id) window.__LIFF_ID__ = data.liff_id;
            } catch (_) {}

            if (!window.__LIFF_ID__) {
                showError('LIFF 尚未設定，請聯繫管理員');
                return;
            }

            try {
                await liff.init({ liffId: window.__LIFF_ID__ });

                // 非 LINE App 內開啟 → 提示
                if (!liff.isInClient()) {
                    showError('請在手機上透過 LINE 開啟此連結');
                    return;
                }

                const accessToken = liff.getAccessToken();
                if (!accessToken) {
                    showError('無法取得 LINE 授權，請重試');
                    return;
                }

                const partnerCode = getPartnerCode();

                if (partnerCode) {
                    // 模式一：綁定（從儀表板點「綁定 LINE」進來，帶 code 參數）
                    document.getElementById('loadingMsg').textContent = '正在綁定 LINE 帳號';
                    await doBind(accessToken, partnerCode);
                } else {
                    // 模式二：自動登入（從 LINE 點一般連結進來，不帶 code）
                    document.getElementById('loadingMsg').textContent = '正在自動登入';
                    await doAutoLogin(accessToken);
                }

            } catch (e) {
                console.error('LIFF error:', e);
                showError('系統錯誤，請稍後重試');
            }
        }

        // 自動登入：用 access token 查詢已綁定的 partner
        async function doAutoLogin(accessToken) {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'line_auto_login',
                    access_token: accessToken
                })
            });
            const result = await resp.json();

            if (result.success && result.dashboard_url) {
                document.getElementById('successTitle').textContent = '登入成功';
                document.getElementById('successMsg').textContent =
                    result.partner_name ? `${result.partner_name}，歡迎回來` : '歡迎回來';
                showState('success');
                setTimeout(() => { window.location.href = result.dashboard_url; }, 800);
            } else {
                showError(result.error || '此 LINE 帳號尚未綁定大使身份，請先使用帳號密碼登入後進行綁定');
            }
        }

        // 綁定：用 access token + partner_code 綁定
        async function doBind(accessToken, partnerCode) {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'bind_line_account',
                    partner_code: partnerCode,
                    access_token: accessToken
                })
            });
            const result = await resp.json();

            if (result.success) {
                document.getElementById('successTitle').textContent = '綁定成功';
                document.getElementById('successMsg').textContent =
                    result.line_display_name
                        ? `${result.line_display_name}，你的 LINE 帳號已綁定成功`
                        : '你的 LINE 帳號已綁定成功';
                showState('success');
                setTimeout(() => {
                    window.location.href = result.dashboard_url || DASHBOARD_URL;
                }, 1500);
            } else {
                showError(result.error || '綁定失敗，請稍後重試');
            }
        }

        start();
    </script>
</body>
</html>
