<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知音計畫 - 數據分析儀表板</title>
    <script src="admin-auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FDFBF8; color: #5C544B; }
        h1, h2, h3, .font-serif { font-family: 'Noto Serif TC', serif; }
        .brand-accent { color: #2E4B36; }
        .brand-card { background-color: #FFFFFF; border: 1px solid #EAE6E1; border-radius: 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .chart-container { position: relative; height: 300px; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(253,251,248,0.9); display: flex; align-items: center; justify-content: center; z-index: 50; }
    </style>
</head>
<body class="antialiased min-h-screen py-8">
    <div id="loadingOverlay" class="loading-overlay">
        <div class="text-center">
            <div class="text-4xl mb-4 animate-pulse">🌲</div>
            <div class="text-lg text-stone-600">正在載入分析數據...</div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold brand-accent mb-4">知音計畫數據分析儀表板</h1>
            <p class="text-lg text-stone-600">即時數據 — 來自 Supabase / Google Sheets</p>
            <div class="flex justify-center space-x-4 mt-4">
                <button onclick="refreshAllData()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                    🔄 重新整理
                </button>
                <button onclick="exportAnalyticsReport()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                    📊 匯出 CSV
                </button>
                <a href="admin-dashboard-real.html" class="bg-stone-200 text-stone-700 px-4 py-2 rounded-lg hover:bg-stone-300 inline-block">
                    ← 回主控台
                </a>
            </div>
        </header>

        <!-- 核心指標概覽 -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
            <div class="brand-card p-5 text-center">
                <div class="text-3xl font-bold text-blue-600" id="totalPartners">-</div>
                <div class="text-sm text-stone-600 mt-1">大使總數</div>
            </div>
            <div class="brand-card p-5 text-center">
                <div class="text-3xl font-bold text-green-600" id="totalClicks">-</div>
                <div class="text-sm text-stone-600 mt-1">總點擊數</div>
            </div>
            <div class="brand-card p-5 text-center">
                <div class="text-3xl font-bold text-purple-600" id="totalBookings">-</div>
                <div class="text-sm text-stone-600 mt-1">總訂房數</div>
            </div>
            <div class="brand-card p-5 text-center">
                <div class="text-3xl font-bold text-amber-600" id="totalCompleted">-</div>
                <div class="text-sm text-stone-600 mt-1">完成入住</div>
            </div>
            <div class="brand-card p-5 text-center">
                <div class="text-3xl font-bold text-red-600" id="totalCommission">-</div>
                <div class="text-sm text-stone-600 mt-1">累計佣金發放</div>
            </div>
        </div>

        <!-- 轉換漏斗 -->
        <div class="brand-card p-8 mb-8">
            <h2 class="font-serif text-2xl font-semibold brand-accent mb-6">轉換漏斗</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="text-center">
                    <div class="bg-blue-100 rounded-lg p-6 mb-3">
                        <div class="text-3xl font-bold text-blue-600" id="funnelClicks">-</div>
                        <div class="text-sm text-blue-700">點擊連結</div>
                    </div>
                    <div class="text-xs text-stone-500">100%</div>
                </div>
                <div class="text-center">
                    <div class="bg-green-100 rounded-lg p-6 mb-3">
                        <div class="text-3xl font-bold text-green-600" id="funnelBookings">-</div>
                        <div class="text-sm text-green-700">建立訂房</div>
                    </div>
                    <div class="text-xs text-stone-500" id="bookingRate">-%</div>
                </div>
                <div class="text-center">
                    <div class="bg-purple-100 rounded-lg p-6 mb-3">
                        <div class="text-3xl font-bold text-purple-600" id="funnelCompleted">-</div>
                        <div class="text-sm text-purple-700">完成入住</div>
                    </div>
                    <div class="text-xs text-stone-500" id="completionRate">-%</div>
                </div>
                <div class="text-center">
                    <div class="bg-amber-100 rounded-lg p-6 mb-3">
                        <div class="text-3xl font-bold text-amber-600" id="funnelPaid">-</div>
                        <div class="text-sm text-amber-700">佣金已結算</div>
                    </div>
                    <div class="text-xs text-stone-500" id="paidRate">-%</div>
                </div>
            </div>
        </div>

        <!-- 圖表區 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- 大使績效排行 -->
            <div class="brand-card p-8">
                <h2 class="font-serif text-2xl font-semibold brand-accent mb-4">大使績效排行</h2>
                <div class="mb-3">
                    <select id="performanceSort" onchange="updateAmbassadorChart()" class="text-sm border rounded px-3 py-1">
                        <option value="referrals">成功推薦數</option>
                        <option value="commission">累計佣金</option>
                        <option value="clicks">點擊數</option>
                    </select>
                </div>
                <div class="chart-container">
                    <canvas id="ambassadorChart"></canvas>
                </div>
            </div>

            <!-- 等級分佈 -->
            <div class="brand-card p-8">
                <h2 class="font-serif text-2xl font-semibold brand-accent mb-4">大使等級分佈</h2>
                <div class="chart-container">
                    <canvas id="levelChart"></canvas>
                </div>
                <div class="mt-4 space-y-2">
                    <div class="flex justify-between">
                        <span class="text-sm flex items-center"><span class="w-3 h-3 bg-green-500 rounded mr-2"></span>LV1 知音大使</span>
                        <span class="text-sm font-semibold" id="lv1Count">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-sm flex items-center"><span class="w-3 h-3 bg-blue-500 rounded mr-2"></span>LV2 森林嚮導</span>
                        <span class="text-sm font-semibold" id="lv2Count">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-sm flex items-center"><span class="w-3 h-3 bg-purple-500 rounded mr-2"></span>LV3 秘境守護者</span>
                        <span class="text-sm font-semibold" id="lv3Count">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 佣金分佈 + 訂房狀態 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="brand-card p-8">
                <h2 class="font-serif text-2xl font-semibold brand-accent mb-4">佣金類型分佈</h2>
                <div class="chart-container">
                    <canvas id="commissionTypeChart"></canvas>
                </div>
            </div>
            <div class="brand-card p-8">
                <h2 class="font-serif text-2xl font-semibold brand-accent mb-4">訂房狀態分佈</h2>
                <div class="chart-container">
                    <canvas id="bookingStatusChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 點擊趨勢 -->
        <div class="brand-card p-8 mb-8">
            <h2 class="font-serif text-2xl font-semibold brand-accent mb-4">點擊趨勢（近 30 天）</h2>
            <div class="chart-container" style="height: 350px;">
                <canvas id="clickTrendChart"></canvas>
            </div>
        </div>

        <!-- 詳細數據表格 -->
        <div class="brand-card p-8 mb-8">
            <h2 class="font-serif text-2xl font-semibold brand-accent mb-6">大使詳細數據</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b text-left">
                            <th class="py-3 px-3">大使</th>
                            <th class="py-3 px-3 text-center">等級</th>
                            <th class="py-3 px-3 text-center">點擊</th>
                            <th class="py-3 px-3 text-center">訂房</th>
                            <th class="py-3 px-3 text-center">完成</th>
                            <th class="py-3 px-3 text-center">轉換率</th>
                            <th class="py-3 px-3 text-right">累計佣金</th>
                            <th class="py-3 px-3 text-right">待付現金</th>
                            <th class="py-3 px-3 text-right">住宿金餘額</th>
                        </tr>
                    </thead>
                    <tbody id="detailedTable">
                        <tr><td colspan="9" class="text-center py-8 text-stone-500">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="text-center text-xs text-stone-400 py-4">
            數據更新時間：<span id="lastUpdate">-</span>
        </footer>
    </div>

    <script>
        const API_URL = '/api';
        let rawData = { partners: [], bookings: [], clicks: [], payouts: [] };
        let charts = {};

        // ========== 資料載入 ==========
        async function loadData() {
            try {
                const adminSecret = localStorage.getItem('admin_secret') || sessionStorage.getItem('admin_secret');
                if (!adminSecret) {
                    throw new Error('請先登入管理後台');
                }

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_all_data', admin_secret: adminSecret })
                });

                const result = await res.json();
                if (!result.success) throw new Error(result.error || '載入失敗');

                rawData.partners = result.data.partners || [];
                rawData.bookings = result.data.bookings || [];
                rawData.clicks = result.data.clicks || [];
                rawData.payouts = result.data.payouts || [];

                renderAll();
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-TW');
            } catch (err) {
                console.error('載入失敗:', err);
                alert('載入數據失敗：' + err.message);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        // ========== 渲染所有區塊 ==========
        function renderAll() {
            renderKPIs();
            renderFunnel();
            renderAmbassadorChart();
            renderLevelChart();
            renderCommissionTypeChart();
            renderBookingStatusChart();
            renderClickTrend();
            renderDetailedTable();
        }

        // ========== KPI 卡片 ==========
        function renderKPIs() {
            const { partners, bookings, clicks, payouts } = rawData;
            const completed = bookings.filter(b => b.stay_status === 'COMPLETED');
            const totalEarned = partners.reduce((s, p) => s + (parseFloat(p.total_commission_earned) || 0), 0);

            document.getElementById('totalPartners').textContent = partners.length;
            document.getElementById('totalClicks').textContent = clicks.length.toLocaleString();
            document.getElementById('totalBookings').textContent = bookings.length;
            document.getElementById('totalCompleted').textContent = completed.length;
            document.getElementById('totalCommission').textContent = '$' + Math.round(totalEarned).toLocaleString();
        }

        // ========== 轉換漏斗 ==========
        function renderFunnel() {
            const { bookings, clicks, payouts } = rawData;
            const totalClicks = clicks.length;
            const totalBookings = bookings.length;
            const completed = bookings.filter(b => b.stay_status === 'COMPLETED').length;
            const paidPayouts = payouts.filter(p => p.payout_status === 'COMPLETED').length;

            document.getElementById('funnelClicks').textContent = totalClicks.toLocaleString();
            document.getElementById('funnelBookings').textContent = totalBookings;
            document.getElementById('funnelCompleted').textContent = completed;
            document.getElementById('funnelPaid').textContent = paidPayouts;

            const fmt = (a, b) => b > 0 ? ((a / b) * 100).toFixed(1) + '%' : '0%';
            document.getElementById('bookingRate').textContent = fmt(totalBookings, totalClicks);
            document.getElementById('completionRate').textContent = fmt(completed, totalClicks);
            document.getElementById('paidRate').textContent = fmt(paidPayouts, totalClicks);
        }

        // ========== 大使績效排行 ==========
        function renderAmbassadorChart() {
            const ctx = document.getElementById('ambassadorChart').getContext('2d');
            if (charts.ambassador) charts.ambassador.destroy();

            const stats = getPartnerStats();
            updateAmbassadorChartData(ctx, stats);
        }

        function updateAmbassadorChart() {
            const ctx = document.getElementById('ambassadorChart').getContext('2d');
            if (charts.ambassador) charts.ambassador.destroy();
            updateAmbassadorChartData(ctx, getPartnerStats());
        }

        function updateAmbassadorChartData(ctx, stats) {
            const sortBy = document.getElementById('performanceSort').value;
            const key = sortBy === 'referrals' ? 'completed' : sortBy === 'commission' ? 'totalEarned' : 'clicks';
            const sorted = [...stats].sort((a, b) => b[key] - a[key]).slice(0, 10);

            const labelMap = { referrals: '成功推薦', commission: '累計佣金 ($)', clicks: '點擊數' };

            charts.ambassador = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(s => s.name || s.code),
                    datasets: [{
                        label: labelMap[sortBy],
                        data: sorted.map(s => Math.round(s[key])),
                        backgroundColor: '#2E4B36'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } }
                }
            });
        }

        // ========== 等級分佈 ==========
        function renderLevelChart() {
            const ctx = document.getElementById('levelChart').getContext('2d');
            if (charts.level) charts.level.destroy();

            const counts = { LV1: 0, LV2: 0, LV3: 0 };
            rawData.partners.forEach(p => {
                const lvl = (p.level || p.partner_level || '').toUpperCase();
                if (lvl.includes('LV3') || lvl.includes('GUARDIAN')) counts.LV3++;
                else if (lvl.includes('LV2') || lvl.includes('GUIDE')) counts.LV2++;
                else counts.LV1++;
            });

            charts.level = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['LV1 知音大使', 'LV2 森林嚮導', 'LV3 秘境守護者'],
                    datasets: [{ data: [counts.LV1, counts.LV2, counts.LV3], backgroundColor: ['#10B981', '#3B82F6', '#8B5CF6'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            document.getElementById('lv1Count').textContent = counts.LV1 + ' 人';
            document.getElementById('lv2Count').textContent = counts.LV2 + ' 人';
            document.getElementById('lv3Count').textContent = counts.LV3 + ' 人';
        }

        // ========== 佣金類型分佈 ==========
        function renderCommissionTypeChart() {
            const ctx = document.getElementById('commissionTypeChart').getContext('2d');
            if (charts.commType) charts.commType.destroy();

            const types = {};
            rawData.payouts.forEach(p => {
                const t = p.payout_type || 'OTHER';
                types[t] = (types[t] || 0) + (parseFloat(p.amount) || 0);
            });

            const labels = Object.keys(types);
            const labelMap = {
                ACCOMMODATION: '住宿金', CASH: '現金佣金', REVERSAL: '回沖',
                ADJUSTMENT: '手動調整', CONVERSION: '轉換', CASH_CONVERSION: '點數轉現金',
                POINTS_ADJUSTMENT: '點數調整'
            };

            charts.commType = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.map(l => labelMap[l] || l),
                    datasets: [{
                        data: labels.map(l => Math.round(types[l])),
                        backgroundColor: ['#10B981', '#3B82F6', '#EF4444', '#F59E0B', '#8B5CF6', '#EC4899', '#6B7280']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
                }
            });
        }

        // ========== 訂房狀態分佈 ==========
        function renderBookingStatusChart() {
            const ctx = document.getElementById('bookingStatusChart').getContext('2d');
            if (charts.bookingStatus) charts.bookingStatus.destroy();

            const statuses = {};
            rawData.bookings.forEach(b => {
                const s = b.stay_status || 'UNKNOWN';
                statuses[s] = (statuses[s] || 0) + 1;
            });

            const statusMap = {
                PENDING: '待入住', COMPLETED: '已完成', CANCELLED: '已取消', NO_SHOW: '未到'
            };
            const colorMap = {
                PENDING: '#F59E0B', COMPLETED: '#10B981', CANCELLED: '#EF4444', NO_SHOW: '#6B7280'
            };
            const keys = Object.keys(statuses);

            charts.bookingStatus = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: keys.map(k => statusMap[k] || k),
                    datasets: [{
                        data: keys.map(k => statuses[k]),
                        backgroundColor: keys.map(k => colorMap[k] || '#9CA3AF')
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } }
                }
            });
        }

        // ========== 點擊趨勢 ==========
        function renderClickTrend() {
            const ctx = document.getElementById('clickTrendChart').getContext('2d');
            if (charts.trend) charts.trend.destroy();

            // 近 30 天每日點擊數
            const dailyCounts = {};
            const now = new Date();
            for (let i = 29; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const key = d.toISOString().slice(0, 10);
                dailyCounts[key] = 0;
            }

            rawData.clicks.forEach(c => {
                const day = (c.timestamp || c.created_at || '').slice(0, 10);
                if (day in dailyCounts) dailyCounts[day]++;
            });

            const labels = Object.keys(dailyCounts).map(d => {
                const dt = new Date(d + 'T00:00:00');
                return dt.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' });
            });

            charts.trend = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: '每日點擊',
                        data: Object.values(dailyCounts),
                        borderColor: '#2E4B36',
                        backgroundColor: 'rgba(46,75,54,0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // ========== 詳細表格 ==========
        function renderDetailedTable() {
            const stats = getPartnerStats().sort((a, b) => b.totalEarned - a.totalEarned);
            const tbody = document.getElementById('detailedTable');

            if (stats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-8 text-stone-500">暫無數據</td></tr>';
                return;
            }

            const levelLabel = (lvl) => {
                const l = (lvl || '').toUpperCase();
                if (l.includes('LV3') || l.includes('GUARDIAN')) return '<span class="px-2 py-0.5 rounded text-xs bg-purple-100 text-purple-800">LV3</span>';
                if (l.includes('LV2') || l.includes('GUIDE')) return '<span class="px-2 py-0.5 rounded text-xs bg-blue-100 text-blue-800">LV2</span>';
                return '<span class="px-2 py-0.5 rounded text-xs bg-green-100 text-green-800">LV1</span>';
            };

            tbody.innerHTML = stats.map(s => `
                <tr class="border-b hover:bg-stone-50">
                    <td class="py-2 px-3">
                        <div class="font-medium">${s.name || s.code}</div>
                        <div class="text-xs text-stone-400">${s.code}</div>
                    </td>
                    <td class="py-2 px-3 text-center">${levelLabel(s.level)}</td>
                    <td class="py-2 px-3 text-center">${s.clicks}</td>
                    <td class="py-2 px-3 text-center">${s.bookings}</td>
                    <td class="py-2 px-3 text-center font-semibold text-green-600">${s.completed}</td>
                    <td class="py-2 px-3 text-center">${s.clicks > 0 ? ((s.completed / s.clicks) * 100).toFixed(1) + '%' : '-'}</td>
                    <td class="py-2 px-3 text-right">$${Math.round(s.totalEarned).toLocaleString()}</td>
                    <td class="py-2 px-3 text-right">$${Math.round(s.pendingCash).toLocaleString()}</td>
                    <td class="py-2 px-3 text-right">$${Math.round(s.points).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        // ========== 輔助函數 ==========
        function getPartnerStats() {
            return rawData.partners.map(p => {
                const code = p.partner_code;
                const clickCount = rawData.clicks.filter(c => c.partner_code === code).length;
                const pBookings = rawData.bookings.filter(b => b.partner_code === code);
                const completedCount = pBookings.filter(b => b.stay_status === 'COMPLETED').length;

                return {
                    code,
                    name: p.name || code,
                    level: p.level || p.partner_level || 'LV1_INSIDER',
                    clicks: clickCount,
                    bookings: pBookings.length,
                    completed: completedCount,
                    totalEarned: parseFloat(p.total_commission_earned) || 0,
                    pendingCash: parseFloat(p.pending_commission) || 0,
                    points: parseFloat(p.available_points) || 0
                };
            });
        }

        function refreshAllData() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            loadData();
        }

        function exportAnalyticsReport() {
            const stats = getPartnerStats().sort((a, b) => b.totalEarned - a.totalEarned);
            const rows = stats.map(s => ({
                '大使代碼': s.code,
                '姓名': s.name,
                '等級': s.level,
                '點擊數': s.clicks,
                '訂房數': s.bookings,
                '完成數': s.completed,
                '轉換率': s.clicks > 0 ? ((s.completed / s.clicks) * 100).toFixed(1) + '%' : '0%',
                '累計佣金': Math.round(s.totalEarned),
                '待付現金': Math.round(s.pendingCash),
                '住宿金餘額': Math.round(s.points)
            }));

            if (rows.length === 0) return alert('無數據可匯出');
            const headers = Object.keys(rows[0]);
            const csv = '\uFEFF' + [headers.join(','), ...rows.map(r => headers.map(h => r[h]).join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `知音計畫分析報表_${new Date().toISOString().slice(0, 10)}.csv`;
            link.click();
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
